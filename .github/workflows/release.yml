name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches gem version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gem_version="$(ruby -Ilib -rsealed_id/version -e 'print SealedId::VERSION')"
          test "$RELEASE_TAG" = "v${gem_version}" || {
            echo "::error::Tag ${RELEASE_TAG} does not match gem version ${gem_version}"
            exit 1
          }
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - name: Validate release package
        run: |
          gem build sealed_id.gemspec --strict --output /tmp/sealed_id.gem
          gem check /tmp/sealed_id.gem

  rubygems:
    name: Publish RubyGem
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://rubygems.org/gems/sealed_id
    permissions:
      contents: read
      id-token: write # Trusted publishing; the gem requires MFA, which a static key can't satisfy here.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build and validate gem
        run: |
          version="$(ruby -Ilib -rsealed_id/version -e 'print SealedId::VERSION')"
          mkdir -p pkg
          gem build sealed_id.gemspec --output "pkg/sealed_id-${version}.gem"
          gem check "pkg/sealed_id-${version}.gem"
          echo "version=${version}" >> "$GITHUB_ENV"
      - name: Check whether this version is already published
        id: published
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/sealed_id/versions/${version}.json")"
          case "$status" in
            200) echo "already=true" >> "$GITHUB_OUTPUT"; echo "sealed_id ${version} is already on RubyGems" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::RubyGems returned HTTP ${status}"; exit 1 ;;
          esac
      - name: Configure RubyGems credentials
        if: steps.published.outputs.already == 'false'
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish to RubyGems
        if: steps.published.outputs.already == 'false'
        run: gem push "pkg/sealed_id-${version}.gem" --host https://rubygems.org </dev/null

  github-release:
    name: Create GitHub release
    needs: [rubygems]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build gem asset
        run: |
          version="$(ruby -Ilib -rsealed_id/version -e 'print SealedId::VERSION')"
          mkdir -p pkg
          gem build sealed_id.gemspec --output "pkg/sealed_id-${version}.gem"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" pkg/*.gem \
              --verify-tag \
              --generate-notes
          fi
